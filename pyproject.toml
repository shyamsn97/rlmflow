[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rlmflow"
version = "0.4.2"
description = "Build recursive agents as inspectable execution graphs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Shyam Sudhakaran", email = "shyamsnair@protonmail.com" },
]
keywords = ["llm", "agent", "recursive", "graph", "repl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "cloudpickle>=3.0",
    "fire>=0.6",
    "jsonschema>=4.0",
    "pydantic>=2.0",
    "tenacity>=8.0",
]

[project.scripts]
rlmflow = "rlmflow.cli:main"

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]
tinker = ["tinker", "tinker-cookbook"]
openenv = ["openenv>=0.4"]
dspy = ["dspy"]
mcp = ["mcp"]
modal = ["modal"]
eval = [
    "tqdm>=4.66",
    "wandb>=0.16",
    "datasets>=2.19",
    "huggingface_hub>=0.23",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "openpyxl>=3.1",
    "PyPDF2>=3.0",
    "python-docx>=1.1",
]
sandbox = ["modal"]
# The browser viewer. The figure, the timeline, the HTML stepper, and replay need
# nothing; this is only for `open_viewer` / `rlmflow view --browser`.
viewer = ["gradio>=4.44", "rich>=13.0"]
# Rasterising those figures into PNG frames or a GIF.
image = ["cairosvg>=2.7", "pillow>=10.0"]
tui = ["textual>=0.70", "rich>=13.0"]
all = [
    "openai>=1.0",
    "anthropic>=0.20",
    "tinker",
    "tinker-cookbook",
    "dspy",
    "mcp",
    "modal",
    "tqdm>=4.66",
    "wandb>=0.16",
    "datasets>=2.19",
    "huggingface_hub>=0.23",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "openpyxl>=3.1",
    "PyPDF2>=3.0",
    "python-docx>=1.1",
    "openenv>=0.4",
    "rich>=13.0",
    "textual>=0.70",
    "gradio>=4.44",
    "cairosvg>=2.7",
    "pillow>=10.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.0",
    "ruff>=0.4",
    "rich>=13.0",
    # So tests/test_rao_openenv.py runs a real env server instead of skipping.
    "openenv>=0.4",
]

[project.urls]
Homepage = "https://github.com/shyamsn97/rlmflow"
Repository = "https://github.com/shyamsn97/rlmflow"
Issues = "https://github.com/shyamsn97/rlmflow/issues"

[tool.hatch.build.targets.wheel]
packages = ["rlmflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q --strict-markers"
markers = [
    # Behavioral checks against a real model: they cost money and are stochastic,
    # so they gate prompt changes by hand (`make test-live`) rather than in CI.
    "live: needs a live LLM API key; runs only with RLMFLOW_LIVE_TESTS=1",
]
# ``pytest-timeout`` is listed in the ``dev`` optional dependencies. If a test
# ever hangs (REPL stdio deadlock, runaway proxy loop), this caps the damage
# instead of the whole CI job stalling for hours.
timeout = 30
timeout_method = "thread"

[tool.coverage.run]
source = ["rlmflow"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

# `make lint` runs isort, then black, then ruff over the same files, so all three
# need the same column limit. Black defaults to 88, which used to re-wrap lines
# ruff considered fine — and a re-wrapped `except` moves a trailing `# noqa` off
# the line it suppresses.
[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "examples/_data",
    "examples/_runs",
    "examples/autoresearch/prepare.py",
    "examples/autoresearch/train.py",
    # Fixing a notebook rewrites the whole .ipynb JSON, so a one-import fix lands
    # as a several-hundred-line diff. Not worth linting them for that.
    "*.ipynb",
]

# Selected explicitly rather than left to ruff's defaults, which have widened
# across releases: CI installs ruff unpinned, so an implicit rule set means a
# green branch can go red without a code change. Anything added here has to be
# paired with a pin bump in .github/workflows/ci.yml.
[tool.ruff.lint]
select = [
    "E4",     # import placement (E402 is what the `from common import ...` noqas suppress)
    "E7",
    "E9",
    "F",      # pyflakes
    "I",      # import sorting, matching the isort pass in `make lint`
    "UP",     # pyupgrade, floored at py311
    "BLE",    # blind except — deliberate ones are annotated with a reason
    "S102",   # exec(), allowed only where the REPL needs it
    "RUF100", # keep the noqa list above honest
]

[tool.ruff.lint.per-file-ignores]
"examples/autoresearch/train.py" = ["E402"]
