[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rlmflow"
version = "0.4.2"
description = "Build recursive agents as inspectable execution graphs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Shyam Sudhakaran", email = "shyamsnair@protonmail.com" },
]
keywords = ["llm", "agent", "recursive", "graph", "repl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jsonschema>=4.0",
    "pydantic>=2.0",
    "tenacity>=8.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]
tinker = ["tinker", "tinker-cookbook"]
dspy = ["dspy"]
mcp = ["mcp"]
modal = ["modal"]
e2b = ["e2b"]
# By-value injection/retrieval of live Python objects across a process-isolated
# runtime (SubprocessRuntime / Docker / Modal). Not needed for LocalRuntime.
cloudpickle = ["cloudpickle>=2.2"]
daytona = ["daytona-sdk"]
eval = [
    "tqdm>=4.66",
    "wandb>=0.16",
    "datasets>=2.19",
    "huggingface_hub>=0.23",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "openpyxl>=3.1",
    "PyPDF2>=3.0",
    "python-docx>=1.1",
]
sandbox = ["modal", "e2b", "daytona-sdk"]
viewer = ["rich>=13.0"]
tui = ["textual>=0.70", "rich>=13.0"]
all = [
    "openai>=1.0",
    "anthropic>=0.20",
    "tinker",
    "tinker-cookbook",
    "dspy",
    "mcp",
    "modal",
    "e2b",
    "daytona-sdk",
    "cloudpickle>=2.2",
    "tqdm>=4.66",
    "wandb>=0.16",
    "datasets>=2.19",
    "huggingface_hub>=0.23",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "openpyxl>=3.1",
    "PyPDF2>=3.0",
    "python-docx>=1.1",
    "rich>=13.0",
    "textual>=0.70",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.0",
    "ruff>=0.4",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/shyamsn97/rlmflow"
Repository = "https://github.com/shyamsn97/rlmflow"
Issues = "https://github.com/shyamsn97/rlmflow/issues"

[tool.hatch.build.targets.wheel]
packages = ["rlmflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q --strict-markers"
# ``pytest-timeout`` is listed in the ``dev`` optional dependencies. If a test
# ever hangs (REPL stdio deadlock, runaway proxy loop), this caps the damage
# instead of the whole CI job stalling for hours.
timeout = 30
timeout_method = "thread"

[tool.coverage.run]
source = ["rlmflow"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "examples/_data",
    "examples/_runs",
    "examples/autoresearch_mini/prepare.py",
    "examples/autoresearch_mini/train.py",
]

[tool.ruff.lint.per-file-ignores]
"examples/autoresearch_mini/train.py" = ["E402"]
