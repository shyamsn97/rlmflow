# Continuous integration: runs on every PR and on push to main.
# Tag-driven publish lives in release.yml — this workflow only gates correctness.

name: ci

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Pinned: the rule set in pyproject.toml is chosen against this version.
      - run: pip install ruff==0.16.0
      - run: ruff check .

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[docs]"
      - run: python -m mdformat --wrap no --check README.md CHANGELOG.md UPGRADING.md docs/*.md
      - run: mkdocs build --strict

  providers:
    name: providers (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: minimum
            openai: openai==3.0.0
            anthropic: anthropic==1.0.0
          - name: latest
            openai: openai
            anthropic: anthropic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e . pytest "${{ matrix.openai }}" "${{ matrix.anthropic }}"
      - run: pytest -q tests/test_llm.py
      - name: Construct both provider clients
        env:
          OPENAI_API_KEY: test
          ANTHROPIC_API_KEY: test
        run: |
          python - <<'PY'
          from rlmflow.llm import AnthropicClient, OpenAIClient

          OpenAIClient("test")
          AnthropicClient("test")
          PY

  test:
    name: pytest (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pip check
      - run: pytest -q --strict-markers --cov=rlmflow --cov-report=term-missing
