# Tag-driven release: tests → PyPI (trusted publishing) → Docker image (GHCR).
#
# Trigger:
#   git tag v0.1.2 && git push origin v0.1.2
#
# One-time setup:
#   1. PyPI → Your projects → rlmflow → Publishing → Add a new pending
#      publisher with:
#         owner:       shyamsn97
#         repository:  rlmflow
#         workflow:    release.yml
#         environment: release
#   2. GitHub → Settings → Environments → New environment "release"
#      (optional: require manual approval on tag push).
#   3. Nothing to do for GHCR — ${{ secrets.GITHUB_TOKEN }} is enough.
#
# If you prefer Docker Hub over GHCR, swap the `login` step for
# `docker/login-action@v3` against `docker.io` with `DOCKERHUB_USERNAME`
# and `DOCKERHUB_TOKEN` repo secrets, and change `IMAGE` below.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/rlmflow
  PYTHON_DEFAULT: "3.12"

jobs:
  preflight:
    name: validate release manifest
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        name: Validate immutable tag and package version
        shell: bash
        run: |
          test "${GITHUB_REF_TYPE}" = "tag"
          VERSION=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          test "${GITHUB_REF_NAME}" = "v${VERSION}" || {
            echo "::error::tag ${GITHUB_REF_NAME} != package version v${VERSION}"
            exit 1
          }
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}" || {
            echo "::error::checkout does not match release commit ${GITHUB_SHA}"
            exit 1
          }
          case "${VERSION}" in
            *a*|*b*|*rc*|*dev*) PRERELEASE=true ;;
            *) PRERELEASE=false ;;
          esac
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${PRERELEASE}" >> "${GITHUB_OUTPUT}"
          VERSION="${VERSION}" PRERELEASE="${PRERELEASE}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              "version": os.environ["VERSION"],
              "tag": os.environ["GITHUB_REF_NAME"],
              "commit": os.environ["GITHUB_SHA"],
              "image": os.environ["IMAGE"],
              "prerelease": os.environ["PRERELEASE"] == "true",
          }
          Path("release-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json
          if-no-files-found: error

  test:
    name: test (${{ matrix.python }})
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  benchmark-contract:
    name: benchmark contract
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: uv lock --check
      - run: pip install -e ".[dev,eval,eval-environments,official-rlm]"
      - name: Verify pinned upstream packages
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from rlm import RLM

          assert RLM
          assert version("rlms") == "0.1.3"
          assert version("mazebench") == "0.2.19"
          assert version("arc-agi") == "0.9.9"
          assert version("arcengine") == "0.9.3"
          PY
      - run: python -m benchmarks.eval.calibrate_search

  artifacts:
    name: build and validate Python artifacts
    needs: [preflight, test, benchmark-contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
      - name: Validate public docs
        run: |
          python -m pip install -e ".[docs]"
          python -m mdformat --wrap no --check README.md CHANGELOG.md UPGRADING.md docs/*.md
          mkdocs build --strict
      - name: Build sdist and wheel once
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-smoke"
          "${RUNNER_TEMP}/wheel-smoke/bin/pip" install dist/*.whl
          "${RUNNER_TEMP}/wheel-smoke/bin/pip" check
          "${RUNNER_TEMP}/wheel-smoke/bin/rlmflow" version
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: publish to PyPI
    needs: [preflight, artifacts]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/rlmflow
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    name: build and push image
    needs: [preflight, artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
      - name: Build and run the hardened Docker smoke
        run: |
          docker build --tag rlmflow:release-smoke .
          python -m pip install dist/*.whl
          python - <<'PY'
          import asyncio

          from rlmflow import DockerRuntime, Flow

          class SmokeLLM:
              def chat(self, _messages):
                  return "```repl\nfinish('docker-ok')\n```"

          flow = Flow(SmokeLLM(), runtime=DockerRuntime("rlmflow:release-smoke"))
          try:
              assert flow.run("smoke", close_repls=True) == "docker-ok"
          finally:
              asyncio.run(flow.aclose())
          PY
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.preflight.outputs.version }}
            type=raw,value=latest,enable=${{ needs.preflight.outputs.prerelease == 'false' }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
